
services:
  postgres:
    image: postgres:16-alpine
    container_name: tradefix-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradefix}
      POSTGRES_USER: ${POSTGRES_USER:-tradefix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data

  app:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: tradefix-app
    restart: always
    depends_on:
      - postgres
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_RBAC_DISABLED: ${NEXT_PUBLIC_RBAC_DISABLED:-false}
      RBAC_DISABLED: ${RBAC_DISABLED:-false}

